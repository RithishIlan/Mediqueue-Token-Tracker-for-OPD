<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediQueue - OPD Token Management</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <!-- Sleek Top Navigation -->
        <nav class="top-nav glass-nav">
            <div class="nav-container">
                <div class="logo-area">
                    <div class="logo-icon"></div>
                    <h2>MediQueue</h2>
                </div>
                <div class="nav-status">
                    <span class="status-dot"></span> System Live
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-container">
            <header class="page-header">
                <h1>Queue Management</h1>
                <p class="subtitle">Register patients and manage the active token queue.</p>
            </header>

            <div class="content-grid">
                <!-- Registration Glass Card -->
                <div class="glass-card registration-card">
                    <h3>Register Patient</h3>
                    <form id="registrationForm">
                        <input type="hidden" id="patientId">
                        
                        <div class="form-group">
                            <label for="name">Patient Name</label>
                            <input type="text" id="name" required placeholder="Enter full name">
                        </div>
                        
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" required placeholder="Enter age" min="0" max="150">
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" id="submitBtn" class="btn-primary">Generate Token</button>
                            <button type="button" id="cancelBtn" class="btn-secondary hidden">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Queue Glass Card -->
                <div class="glass-card queue-card">
                    <h3>Live Queue Status</h3>
                    <div class="table-wrapper">
                        <table id="queueTable" class="modern-table">
                            <thead>
                                <tr>
                                    <th>Token No.</th>
                                    <th>Patient Name</th>
                                    <th>Age</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="queueBody">
                                <!-- Queue data will be populated here by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
